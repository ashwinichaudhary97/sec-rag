[project]
name = "sec-rag"
version = "0.1.0"
description = "Retrieval-augmented generation over SEC 10-K filings"
readme = "README.md"
authors = [
    { name = "Ashwini", email = "16aman786@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.9.1",
    "sec2md==0.1.25",
]

[project.scripts]
sec-rag = "sec_rag:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
